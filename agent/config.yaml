# Hermes Configuration for Student-PA
# Mounted to /home/hermes/.hermes/config.yaml inside the container
# Secrets (API keys) live in /home/hermes/.hermes/.env — do NOT put them here.

model:
  provider: openai
  name: ${DEFAULT_MODEL:-Mythos}

providers:
  openai:
    base_url: https://litellm.byte10x.dev/v1
    api_key: ${LITELLM_API_KEY}

terminal:
  backend: local
  timeout: 180

# Keep file reads safe for large PDFs / datasets
file_read_max_chars: 150000

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

# Context compression — keep conversations healthy on long tasks
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# Memory
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

# Skill guard (optional safety net for agent-created skills)
skills:
  guard_agent_created: false

# Messaging platforms — gateway runs all enabled adapters
platforms:
  telegram:
    enabled: true
  api_server:
    enabled: true
    host: ${API_SERVER_HOST:-0.0.0.0}
    port: ${API_SERVER_PORT:-8642}
    key: ${API_SERVER_KEY}
