services:
  backend:
    build: .
    container_name: student-pa-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      - SIGNUP_BOT_TOKEN=${SIGNUP_BOT_TOKEN}
      - PROVISIONER_SECRET=${PROVISIONER_SECRET}
      - LITELLM_ADMIN_KEY=${LITELLM_ADMIN_KEY}
      - AGENT_IMAGE=${AGENT_IMAGE:-ghcr.io/abenable/student-pa:latest}
      - AGENTS_BASE_DIR=/agents
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Mythos}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=/data/botfather_session
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../agents:/agents
      - backend-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
