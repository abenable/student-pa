services:
  # ── Web UI (TanStack Start) ────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: student-pa-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WORKER_URL: http://worker:8000
      PROVISIONER_SECRET: ${PROVISIONER_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      worker:
        condition: service_started

  # ── Worker / API (FastAPI) ─────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: student-pa-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIGNUP_BOT_TOKEN: ${SIGNUP_BOT_TOKEN}
      PROVISIONER_SECRET: ${PROVISIONER_SECRET}
      LITELLM_ADMIN_KEY: ${LITELLM_ADMIN_KEY}
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/abenable/student-pa:latest}
      AGENTS_BASE_DIR: /agents
      DEFAULT_MODEL: ${DEFAULT_MODEL:-Mythos}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION: /data/botfather_session
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agents:/agents
      - worker-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  worker-data:
