services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: student-pa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      worker:
        condition: service_started
    networks:
      - student-pa

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: student-pa-worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agents:/agents
      - worker-data:/data
      - ./worker/botfather_session.session:/data/botfather_session.session
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - student-pa

volumes:
  worker-data:

networks:
  student-pa:
